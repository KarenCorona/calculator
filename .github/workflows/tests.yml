name: Java CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build with Maven
      working-directory: backend/calc-backend
      run: |
        chmod +x mvnw
        ./mvnw clean package
        
    - name: Start Spring Boot server
      working-directory: backend/calc-backend
      run: |
        java -jar target/*.jar &
        echo "Waiting for server to start..."
        attempt_counter=0
        max_attempts=15
        
        # First verify Java process is running
        until ps aux | grep -q "[j]ava -jar target/.*\.jar"; do
            if [ ${attempt_counter} -eq ${max_attempts} ];then
              echo "Server process failed to start"
              exit 1
            fi
            printf '.'
            attempt_counter=$(($attempt_counter+1))
            sleep 2
        done
        
        echo "Java process running, checking endpoints..."
        
        # Check the actual endpoint with required parameters
        until $(curl --output /dev/null --silent --fail "http://localhost:8080/api/calculator/add?a=1&b=2"); do
            if [ ${attempt_counter} -eq ${max_attempts} ];then
              echo "Max attempts reached"
              echo "Trying to get response from endpoint:"
              curl -v "http://localhost:8080/api/calculator/add?a=1&b=2" || true
              exit 1
            fi
            printf '.'
            attempt_counter=$(($attempt_counter+1))
            sleep 2
        done
        echo "Server ready for testing"
        
    - name: Debug Postman collection location
      run: |
        echo "Current workspace: $GITHUB_WORKSPACE"
        find $GITHUB_WORKSPACE -name "Calculator.postman_collection.json" || echo "Collection not found"
        
    - name: Run API tests with Newman
      run: |
        npm install -g newman
        # Try multiple possible locations for the collection file
        if [ -f "$GITHUB_WORKSPACE/backend/calc-backend/src/test/resources/Calculator.postman_collection.json" ]; then
          newman run "$GITHUB_WORKSPACE/backend/calc-backend/src/test/resources/Calculator.postman_collection.json"
        elif [ -f "$GITHUB_WORKSPACE/src/main/java/com/example/integration/Calculator.postman_collection.json" ]; then
          newman run "$GITHUB_WORKSPACE/src/main/java/com/example/integration/Calculator.postman_collection.json"
        elif [ -f "$GITHUB_WORKSPACE/backend/calc-backend/src/main/java/com/example/integration/Calculator.postman_collection.json" ]; then
          newman run "$GITHUB_WORKSPACE/backend/calc-backend/src/main/java/com/example/integration/Calculator.postman_collection.json"
        else
          echo "ERROR: Could not find Postman collection file in any of these locations:"
          echo "1. backend/calc-backend/src/test/resources/"
          echo "2. src/main/java/com/example/integration/"
          echo "3. backend/calc-backend/src/main/java/com/example/integration/"
          exit 1
        fi
